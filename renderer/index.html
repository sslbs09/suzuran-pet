<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' pet-user: data: blob:; img-src 'self' pet-user: data: file: blob:; font-src 'self' pet-user: data:; media-src 'self' data: blob:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"> <!-- unsafe-eval/blob/data：PIXI/pixi-spine 着色器编译、Worker 与占位纹理必需；本窗口只加载本地文件 -->
<title>苏苏洛桌宠</title>
<link rel="stylesheet" href="pet.css" />
</head>
<body>
<div class="pet-root">
  <!-- 对话气泡 -->
  <div id="bubble" class="bubble hidden" role="status" aria-live="polite">
    <button id="btn-close" class="btn btn-close" title="收起对话框" aria-label="收起对话框" data-i18n-title="ui.closeTitle">×</button>
    <button id="btn-zoom" class="btn btn-zoom" title="放大/还原对话框" aria-label="放大或还原对话框" data-i18n-title="ui.zoomTitle">⤢</button>
    <div id="bubble-text"></div>
    <div id="thinking-dots" class="thinking hidden"><span>.</span><span>.</span><span>.</span></div>
    <div id="swipe-bar" class="swipe-bar hidden"><button id="swipe-prev" title="上一版">‹</button><span id="swipe-pos"></span><button id="swipe-next" title="下一版">›</button><button id="swipe-regen" title="重新生成">↻</button></div>
  </div>

  <!-- 桌宠形象（GIF 表情） -->
  <div id="pet" class="pet">
    <img id="sprite" src="sprites/user/idle1.gif" alt="苏苏洛" data-i18n-alt="ui.petAlt" draggable="false" />
    <!-- Spine 渲染画布（GIF/Spine 切换） -->
    <canvas id="spine-canvas" class="spine-canvas hidden"></canvas>
  </div>

  <!-- PSD 2.5D 角色画布（v2.2，独立大画布，rig 模式全窗口贴底显示） -->
  <canvas id="rig-canvas" class="rig-canvas hidden"></canvas>
  <canvas id="live2d-canvas" class="live2d-canvas hidden"></canvas>

  <!-- 输入栏 -->
  <div id="input-bar" class="input-bar hidden">
    <span id="mode-chip" class="mode-chip" title="点击切换模式" role="button" tabindex="0" aria-label="切换聊天模式" data-i18n-title="ui.modeChipTitle">💬</span>
    <input id="input" type="text" placeholder="和苏苏洛说点什么…" aria-label="聊天输入框" data-i18n-placeholder="ui.placeholder" autocomplete="off" />
    <button id="btn-mic" class="btn btn-mic" title="按住说话" aria-label="按住说话" data-i18n-title="ui.micTitle">🎤</button>
    <button id="btn-stop" class="btn btn-stop hidden" title="停止" aria-label="停止生成" data-i18n-title="ui.stopTitle">■</button>
    <button id="btn-tts" class="btn btn-tts" title="语音开关" aria-label="切换语音" data-i18n-title="ui.ttsTitle">🔊</button>
    <button id="btn-info" class="btn" title="信息版（陪伴时间/日程）" aria-label="打开信息版" data-i18n-title="ui.infoTitle">📋</button>
    <button id="btn-send" class="btn" title="发送" aria-label="发送消息">➤</button>
  </div>

  <!-- 信息版（陪伴时间 + 今日日程） -->
  <div id="info-panel" class="info-panel hidden">
    <div class="info-head">📋 信息版</div>
    <div class="info-companion" id="info-companion"></div>
    <div class="info-schedules" id="info-schedules"></div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="rp-render.js"></script>
<!-- v2.5.22 优化（P2-1）：渲染库 defer 加载——GIF 模式启动不阻塞（pet.js 仅在 initSpine 时才用 PIXI），
     1MB 库后台加载，切 Spine/Live2D 时已就绪；Live2D 专有文件缺失降级提示在 pet.js
     initLive2d 主逻辑检测（v2.5.23 修复新-2：内联 onerror 被 CSP script-src 拦截不会执行） -->
<script defer src="pixi.min.js"></script>
<script defer src="pixi-spine.js"></script>
<script defer src="live2dcubismcore.min.js"></script>
<script defer src="pixi-live2d.min.js"></script>
<script defer src="live2d-runtime.js"></script>
<script defer src="../node_modules/ag-psd/dist/bundle.js"></script>
<script defer src="rig/rigger.js"></script>
<script defer src="rig/genericparts.js"></script>
<script defer src="rig-runtime.js"></script>
<script src="pet.js"></script>
</body>
</html>
