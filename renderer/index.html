<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: file: blob:; media-src 'self' data: blob:"> <!-- unsafe-eval/blob：PIXI/pixi-spine 编译着色器与 Worker 必需；本窗口只加载本地文件 -->
<title>苏苏洛桌宠</title>
<link rel="stylesheet" href="pet.css" />
</head>
<body>
<div class="pet-root">
  <!-- 对话气泡 -->
  <div id="bubble" class="bubble hidden">
    <button id="btn-zoom" class="btn btn-zoom" title="放大/还原对话框" data-i18n-title="ui.zoomTitle">⤢</button>
    <div id="bubble-text"></div>
    <div id="thinking-dots" class="thinking hidden"><span>.</span><span>.</span><span>.</span></div>
  </div>

  <!-- 桌宠形象（GIF 表情） -->
  <div id="pet" class="pet">
    <img id="sprite" src="sprites/user/idle1.gif" alt="苏苏洛" data-i18n-alt="ui.petAlt" draggable="false" />
    <!-- Spine 渲染画布（GIF/Spine 切换） -->
    <canvas id="spine-canvas" class="spine-canvas hidden"></canvas>
  </div>

  <!-- 输入栏 -->
  <div id="input-bar" class="input-bar hidden">
    <span id="mode-chip" class="mode-chip" title="点击切换模式" data-i18n-title="ui.modeChipTitle">💬</span>
    <input id="input" type="text" placeholder="和苏苏洛说点什么…" data-i18n-placeholder="ui.placeholder" autocomplete="off" />
    <button id="btn-mic" class="btn btn-mic" title="按住说话" data-i18n-title="ui.micTitle">🎤</button>
    <button id="btn-stop" class="btn hidden" title="停止" data-i18n-title="ui.stopTitle">■</button>
    <button id="btn-tts" class="btn btn-tts" title="语音开关" data-i18n-title="ui.ttsTitle">🔊</button>
    <button id="btn-send" class="btn">➤</button>
  </div>
</div>
<script src="i18n.js"></script>
<script src="i18n.js"></script>
<script src="pixi.min.js"></script>
<script src="pixi-spine.js"></script>
<script src="pet.js"></script>
</body>
</html>
