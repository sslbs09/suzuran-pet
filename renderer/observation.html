<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"><title data-i18n="page.observation.title">记住这次经历</title><link rel="stylesheet" href="ui.css"></head>
<body class="ui-page observation-page"><style>
.observation-page textarea { width: 100%; margin-bottom: 8px; font-family: inherit; }
.observation-page label { display: block; margin-bottom: 8px; color: var(--ui-ink, inherit); font-size: 14px; }
.observation-page .tip { margin: 0 0 8px; }
.observation-page .preview { margin: 10px 0; font-size: 13px; }
.observation-page .preview-text { color: var(--ui-ink, inherit); word-break: break-word; }
.observation-page label.confirm { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 10px 0; cursor: pointer; }
</style><div class="ui-shell"><header class="ui-header"><h1 data-i18n="page.observation.h1">📝 记住这次经历</h1><div class="sub" data-i18n="page.observation.sub">保存一次你和她真实共同经历过、并希望以后仍然记得的事。同一件经历不需要重复保存。</div></header>
<section>
<label for="note" data-i18n="page.observation.prompt">发生了什么？</label>
<textarea id="note" rows="4" maxlength="2000" placeholder="例如：今天我们一起把新买的薄荷种进盆里，放上了窗台" data-i18n-placeholder="page.observation.ph"></textarea>
<p class="hint tip boundary" data-i18n="page.observation.boundary">只写已经真实发生的部分；计划、猜测或还没发生的结果，不要写成已经发生。</p>
<p class="hint tip secret" data-i18n="page.observation.secret">这里不要填写密码、API key、token、cookie、私钥或其他凭据。</p>
<div class="preview"><span data-i18n="page.observation.preview">将保存：</span><span id="preview-text" class="preview-text"></span></div>
<label class="confirm" for="confirm"><input type="checkbox" id="confirm"><span data-i18n="page.observation.confirm">这是我和她真实共同经历过的事，我希望以后保留。</span></label>
<div class="actions"><button id="submit" class="primary" data-i18n="page.observation.submit">记住这次经历</button><span id="result" class="result"></span></div>
</section>
</div><script src="i18n.js"></script><script src="theme-init.js"></script><script src="observation.js"></script></body></html>
