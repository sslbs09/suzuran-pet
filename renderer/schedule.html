<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"><title>苏苏洛 · 日程安排</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="schedule.css"></head>
<body class="ui-page schedule-page"><div class="ui-shell"><header class="ui-header"><h1>📅 日程安排</h1><div class="sub">手动新增或从 Excel 导入。到点会显示气泡、切换情绪并触发现有语音提醒。</div></header>
<section><h2>新建日程</h2><div class="row"><label class="col grow"><span>标题</span><input id="title" maxlength="160" placeholder="例如：喝药"></label><label class="col"><span>日期</span><input id="date" type="date"></label><label class="col"><span>时间</span><input id="time" type="time"></label></div><div class="row"><label class="col"><span>重复</span><select id="recurrence"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly:1,2,3,4,5">工作日</option><option value="weekly:0,6">周末</option><option value="monthly:1">每月 1 日</option></select></label><label class="col"><span>提醒情绪</span><select id="emotion"><option value="happy">开心</option><option value="think">思考</option><option value="idle">待机</option><option value="surprised">惊讶</option></select></label><label class="col grow"><span>备注</span><input id="notes" maxlength="1000" placeholder="例如：饭后服用"></label></div><div class="actions"><button id="add" class="primary">添加日程</button><span id="result" class="result"></span></div></section>
<section><h2>Excel 导入</h2><p class="hint">第一行使用列名：title、date、time；可选 recurrence、enabled、emotion、notes、externalId。支持 .xlsx，导入前会先显示验证结果。</p><div class="actions"><button id="import">导入 Excel</button><button id="template">下载模板</button><span id="import-result" class="result"></span></div></section>
<section><h2>日程列表</h2><div id="summary" class="hint"></div><div id="list" class="schedule-list"></div></section></div><div id="import-preview" class="modal hidden" role="dialog" aria-modal="true" aria-label="Excel 导入预览"><div class="modal-box"><h3>Excel 导入预览</h3><p id="preview-meta" class="hint"></p><div id="preview-rows" class="preview-rows"></div><div class="actions"><button id="preview-cancel" type="button">取消</button><button id="preview-confirm" class="primary" type="button">确认导入</button></div></div></div><script src="schedule.js"></script></body></html>
