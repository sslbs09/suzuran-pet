<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"><title data-i18n="page.schedule.title">苏苏洛 · 日程安排</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="schedule.css"></head>
<body class="ui-page schedule-page"><div class="ui-shell"><header class="ui-header"><h1 data-i18n="page.schedule.h1">📅 日程安排</h1><div class="sub" data-i18n="page.schedule.sub">手动新增或从 Excel 导入。到点会显示气泡、切换情绪并触发现有语音提醒。</div></header>
<section><h2 data-i18n="page.schedule.new">新建日程</h2><div class="row"><label class="col grow"><span data-i18n="page.schedule.labelTitle">标题</span><input id="title" maxlength="160" placeholder="例如：喝药" data-i18n-placeholder="page.schedule.phTitle"></label><label class="col"><span data-i18n="page.schedule.labelDate">日期</span><input id="date" type="date"></label><label class="col"><span data-i18n="page.schedule.labelTime">时间</span><input id="time" type="time"></label></div><div class="row"><label class="col"><span data-i18n="page.schedule.labelRecurrence">重复</span><select id="recurrence"><option value="none" data-i18n="page.schedule.optNone">不重复</option><option value="daily" data-i18n="page.schedule.optDaily">每天</option><option value="weekly:1,2,3,4,5" data-i18n="page.schedule.optWeekday">工作日</option><option value="weekly:0,6" data-i18n="page.schedule.optWeekend">周末</option><option value="monthly:1" data-i18n="page.schedule.optMonthly">每月 1 日</option></select></label><label class="col"><span data-i18n="page.schedule.labelEmotion">提醒情绪</span><select id="emotion"><option value="happy" data-i18n="page.schedule.emoHappy">开心</option><option value="think" data-i18n="page.schedule.emoThink">思考</option><option value="idle" data-i18n="page.schedule.emoIdle">待机</option><option value="surprised" data-i18n="page.schedule.emoSurprised">惊讶</option></select></label><label class="col grow"><span data-i18n="page.schedule.labelNotes">备注</span><input id="notes" maxlength="1000" placeholder="例如：饭后服用" data-i18n-placeholder="page.schedule.phNotes"></label></div><div class="actions"><button id="add" class="primary" data-i18n="page.schedule.add">添加日程</button><span id="result" class="result"></span></div></section>
<section><h2 data-i18n="page.schedule.excel">Excel 导入</h2><p class="hint" data-i18n="page.schedule.excelHint">第一行使用列名：title、date、time；可选 recurrence、enabled、emotion、notes、externalId。支持 .xlsx，导入前会先显示验证结果。</p><div class="actions"><button id="import" data-i18n="page.schedule.import">导入 Excel</button><button id="template" data-i18n="page.schedule.template">下载模板</button><span id="import-result" class="result"></span></div></section>
<section><h2 data-i18n="page.schedule.list">日程列表</h2><div id="summary" class="hint"></div><div id="list" class="schedule-list"></div></section></div><div id="import-preview" class="modal hidden" role="dialog" aria-modal="true" aria-label="Excel 导入预览" data-i18n-aria-label="page.schedule.preview"><div class="modal-box"><h3 data-i18n="page.schedule.preview">Excel 导入预览</h3><p id="preview-meta" class="hint"></p><div id="preview-rows" class="preview-rows"></div><div class="actions"><button id="preview-cancel" type="button" data-i18n="page.schedule.cancel">取消</button><button id="preview-confirm" class="primary" type="button" data-i18n="page.schedule.confirm">确认导入</button></div></div></div><script src="i18n.js"></script><script src="theme.js"></script>
<script src="theme-init.js"></script><script src="schedule.js"></script></body></html>
