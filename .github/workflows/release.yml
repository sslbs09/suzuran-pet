# Build & 自动发布 Release
# 打正式版本 tag（如 v2.5.18）推送后：自动打包 Windows 免安装版并上传到 Releases
name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($pkg.version)" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} 与 package.json 版本 v$($pkg.version) 不一致"
          }

      - name: 发布前测试与资源检查
        run: |
          npm test
          npm run check:assets

      - name: 打包桌宠（electron-packager）
        run: npm run dist

      - name: 精简语言包（保留中/英/日）
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist | Select-Object -First 1
          Get-ChildItem "$($folder.FullName)\locales" -Filter "*.pak" |
            Where-Object { $_.Name -notin @("zh-CN.pak", "en-US.pak", "ja.pak") } |
            Remove-Item -Force

      - name: 压缩为 zip
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist | Select-Object -First 1
          if (-not $folder) { Write-Error "dist 目录为空"; exit 1 }
          $ver = "${{ github.ref_name }}"
          $zip = "SuzuranPet-$ver-win32-x64.zip"
          Compress-Archive -Path $folder.FullName -DestinationPath $zip -Force
          Write-Host "已生成: $zip"

      - name: 打包 app.asar（供增量自动更新，v2.5.26）
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist | Select-Object -First 1
          npx --yes asar@3.2.0 pack "$($folder.FullName)\resources\app" app.asar
          "${{ github.ref_name }}" | Out-File -Encoding ascii app.asar.version
          Write-Host "已生成 app.asar + app.asar.version"

      - name: 生成发布物 SHA-256 校验和
        shell: pwsh
        run: |
          $zip = "SuzuranPet-${{ github.ref_name }}-win32-x64.zip"
          Get-ChildItem $zip, app.asar, app.asar.version |
            ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Write-Host "SHA256SUMS.txt 已生成"

      - name: 生成 Release 正文（从 CHANGELOG 抽取本版本段落）
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"            # 如 v2.5.18
          $notes = Get-Content CHANGELOG.md -Raw
          # 抽取当前版本段落：从 "## $ver" 到下一个 "## v" 之前
          $match = [regex]::Match($notes, "(?s)## $ver.*?(?=\n## v|\z)")
          if (-not $match.Success) { Write-Error "CHANGELOG.md 中未找到 $ver 段落"; exit 1 }
          $chunk = $match.Value.Trim()
          # 用模板文件生成正文（模板在 deploy/release-body-template.md，避免 YAML 块内 # 注释陷阱）
          $template = Get-Content deploy/release-body-template.md -Raw
          $body = $template.Replace("{{VER}}", $ver).Replace("{{CHANGELOG}}", $chunk)
          Set-Content -Path RELEASE_NOTES.md -Value $body -Encoding UTF8
          Write-Host "RELEASE_NOTES.md 已生成（含 CHANGELOG $ver 段落）"

      - name: 上传到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "苏苏洛桌宠 ${{ github.ref_name }} 正式版"
          body_path: RELEASE_NOTES.md
          files: |
            SuzuranPet-${{ github.ref_name }}-win32-x64.zip
            app.asar
            app.asar.version
            SHA256SUMS.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
