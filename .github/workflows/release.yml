# Build & 自动发布 Release
# 打正式版本 tag（如 v1.0.0）推送后：自动打包 Windows 免安装版并上传到 Releases
name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包桌宠（electron-packager）
        run: npm run dist

      - name: 精简语言包（保留中/英/日）
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist | Select-Object -First 1
          Get-ChildItem "$($folder.FullName)\locales" -Filter "*.pak" |
            Where-Object { $_.Name -notin @("zh-CN.pak", "en-US.pak", "ja.pak") } |
            Remove-Item -Force

      - name: 压缩为 zip
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist | Select-Object -First 1
          if (-not $folder) { Write-Error "dist 目录为空"; exit 1 }
          Compress-Archive -Path $folder.FullName -DestinationPath "SuzuranPet-1.1.0-win32-x64.zip" -Force
          Write-Host "已生成: SuzuranPet-1.1.0-win32-x64.zip"

      - name: 上传到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "苏苏洛桌宠 1.1 正式版"
          body: |
            # 苏苏洛桌宠 1.1 正式版

            本版本为 1.1 发行版：接入本地 GPT-SoVITS v2ProPlus 微调音色（苏苏洛日语语音），新增「日语语音模式」（界面文字保持中文、说话先翻译成日语），界面语言支持中文 / English / 日本語 一键切换；沿用 1.0 的条款确认、隐私/安全文档、可调桌宠大小、本地 Agent 调用接口、自定义调用词、API 模型列表与 19 个可编辑情绪。

            **开源但禁止商用**。使用前请阅读并同意 TERMS.md。日语语音模式需先按「语音部署与训练指南」部署本地 Genie（GPT-SoVITS）日语微调模型。
          files: "SuzuranPet-1.1.0-win32-x64.zip"
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
