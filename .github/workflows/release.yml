# Build & 自动发布 Release
name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: 校验 tag 与 package 版本
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "tag ${{ github.ref_name }} 与 package.json 版本 $expected 不一致"
          }

      - name: 安装依赖
        run: npm ci
      - name: 资源完整性检查
        run: npm run check:assets -- --strict
      - name: ESLint 检查
        run: npm run lint
      - name: 运行测试
        run: npm test
      - name: 密钥存储回归
        run: npm run test:secrets
      - name: 打包桌宠
        run: npm run dist

      - name: 精简语言包
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $folder) { throw "dist 目录为空" }
          $locales = Join-Path $folder.FullName "locales"
          if (Test-Path $locales) {
            Get-ChildItem $locales -Filter "*.pak" |
              Where-Object { $_.Name -notin @("zh-CN.pak", "en-US.pak", "ja.pak") } |
              Remove-Item -Force
          }

      - name: 生成发布包与校验和
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $folder = Get-ChildItem dist -Directory | Select-Object -First 1
          $zip = "SuzuranPet-$($pkg.version)-win32-x64.zip"
          Compress-Archive -Path $folder.FullName -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Set-Content "$zip.sha256"
          Write-Host "已生成: $zip"

      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "苏苏洛桌宠 ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            SuzuranPet-*-win32-x64.zip
            SuzuranPet-*-win32-x64.zip.sha256
          fail_on_unmatched_files: true
