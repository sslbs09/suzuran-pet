# Build & 自动发布 Release
# 打正式版本 tag（如 v1.0.0）推送后：自动打包 Windows 免安装版并上传到 Releases
name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包桌宠（electron-packager）
        run: npm run dist

      - name: 精简语言包（只留中文/英文）
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist | Select-Object -First 1
          Get-ChildItem "$($folder.FullName)\locales" -Filter "*.pak" |
            Where-Object { $_.Name -notin @("zh-CN.pak", "en-US.pak") } |
            Remove-Item -Force

      - name: 压缩为 zip
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist | Select-Object -First 1
          if (-not $folder) { Write-Error "dist 目录为空"; exit 1 }
          Compress-Archive -Path $folder.FullName -DestinationPath "SuzuranPet-1.0.0-win32-x64.zip" -Force
          Write-Host "已生成: SuzuranPet-1.0.0-win32-x64.zip"

      - name: 上传到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "苏苏洛桌宠 1.0 正式版"
          body: |
            # 苏苏洛桌宠 1.0 正式版

            本版本为正式 1.0 发行版，包含条款确认、隐私/安全文档、可调桌宠大小、本地 Agent 调用接口、自定义调用词、API 模型列表、19 个可编辑情绪与本地语音克隆。

            **开源但禁止商用**。使用前请阅读并同意 TERMS.md。
          files: "SuzuranPet-1.0.0-win32-x64.zip"
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
