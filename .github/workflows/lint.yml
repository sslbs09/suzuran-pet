# ESLint 代码规范检查：每次提交 / PR 自动校验 JS 语法与格式
name: Lint (ESLint)

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # 大版本 → 当前受支持的 Node 22 LTS 最新小版本（22.12.0 触发 eslint 依赖 EBADENGINE：^20.19.0 || ^22.13.0 || >=24）
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint
