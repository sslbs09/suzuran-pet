name: ✨ 功能建议
description: 为桌宠提一个新功能或改进想法
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请说明清楚「想要什么」和「为什么」，有示意图更好。
  - type: textarea
    id: idea
    attributes:
      label: 你想实现什么
      description: 一句话描述你的建议
      placeholder: 例如：希望桌宠能……
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要（使用场景）
      description: 在什么场景下你会用到它？
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: 实现思路（可选）
      description: 如果你有具体想法或参考过别的实现，欢迎分享
